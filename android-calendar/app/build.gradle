plugins { id 'com.android.application' }
android {
 namespace 'ru.ryadom.calendar'
 compileSdk 35
 defaultConfig { applicationId 'ru.ryadom.calendar'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.4.2' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] } }
}
dependencies { implementation 'net.sf.biweekly:biweekly:0.6.8'; testImplementation 'junit:junit:4.13.2' }
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
android { defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' } }
dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
